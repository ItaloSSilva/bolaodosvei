name: Build iOS IPA (Bolão dos Véi)

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/build-ios-ipa.yml"
  workflow_dispatch:

jobs:
  build-ipa:
    name: Generate & Archive Unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/BolaoDosVei
        run: xcodegen generate

      - name: Build unsigned iOS archive
        working-directory: ios/BolaoDosVei
        run: |
          xcodebuild archive \
            -project BolaoDosVei.xcodeproj \
            -scheme BolaoDosVei \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/BolaoDosVei.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package BolaoDosVei.ipa
        working-directory: ios/BolaoDosVei
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/BolaoDosVei.xcarchive/Products/Applications/BolaoDosVei.app build/ipa/Payload/
          cd build/ipa
          zip -r ../../BolaoDosVei.ipa Payload

      - name: Upload BolaoDosVei.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: BolaoDosVei-iOS-IPA
          path: ios/BolaoDosVei/BolaoDosVei.ipa
          if-no-files-found: error
